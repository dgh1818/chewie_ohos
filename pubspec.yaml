name: chewie
description: A video player for Flutter with Cupertino and Material play controls
version: 1.11.3
homepage: https://github.com/fluttercommunity/chewie

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  provider: ^6.1.2
  video_player: ^2.9.3
  wakelock_plus: ^1.2.10

dependency_overrides:
  wakelock_plus:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_wakelock_plus.git
      path: 'wakelock_plus'
      ref: br_wakelock_plus_1.2.8_ohos
  video_player:
    git:
      url: git@gitcode.com:openharmony-sig/flutter_packages.git
      path: 'packages/video_player/video_player'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
